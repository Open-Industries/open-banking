# kyc-document-processor — Knative Service: scale to zero, invoked over HTTP or by Broker triggers.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kyc-document-processor
  namespace: banking
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "20"
    spec:
      containers:
        - image: quay.io/open-industries/kyc-document-processor:latest  # replaced by the promoted release digest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: HTTP_PORT, value: "8080" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
